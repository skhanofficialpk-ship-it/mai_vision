name: mai_vision_coaching_academy
description: MAI Coaching Academy - Professional Educational Website
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase — Auth + Firestore only. No Storage (Spark/free plan only).
  firebase_core: ^2.32.0
  firebase_auth: ^4.18.0
  cloud_firestore: ^4.15.0

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.0

  # UI / Responsive
  responsive_framework: ^1.4.0
  google_fonts: ^6.2.1
  visibility_detector: ^0.4.0+2
  url_launcher: ^6.2.6
  csv: ^6.0.0
  intl: ^0.19.0
  fluttertoast: ^8.2.5
  excel: ^4.0.6
  file_saver: ^0.2.13
  pdf: ^3.12.0
  printing: ^5.13.1
  fl_chart: ^1.2.0
  screenshot: ^3.0.0
  screenshot_callback: ^3.0.1
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#ffffff"
  image: "assets/images/logo.png"

  android_12:
    image: "assets/images/logo.png"
    color: "#ffffff"
